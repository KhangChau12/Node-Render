# Publishes the landing page (apps/site) to GitHub Pages.
# The media (reels, stills) are rendered locally with `npm run site:media` and committed,
# so this job only assembles the static files: no install, no Chrome.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/kit/docs/kit-meta.json"
      - "packages/kit/examples/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node apps/site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
